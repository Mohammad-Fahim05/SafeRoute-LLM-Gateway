name: SafeRoute LLM Gateway CI

on:
  push:
    branches: [ "master", "main", "release/*" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]
          pip install pytest-cov sentence-transformers

      - name: Verify Ruff Formatting & Lint (if configured)
        run: |
          pip install ruff || true
          ruff check . || echo "Ruff check completed with notes."

      - name: Run Backend Test Suite with Coverage
        run: |
          python -m pytest tests/unit tests/integration tests/test_security.py -q --cov=app --cov-report=term-missing --cov-report=xml
        env:
          APP_ENV: test
          AUTH_ENABLED: "true"
          AUTH_SECRET: "ci_pipeline_hmac_secret_key_minimum_32_chars!"
          CACHE_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
          SAFETY_CLASSIFIER_ENABLED: "false"

  frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Dependency Installation
        run: npm ci

      - name: Frontend Linter
        run: npm run lint

      - name: TypeScript & Production Build
        run: npm run build

      - name: Verify Bundle Outputs
        run: |
          test -f dist/index.html || exit 1
          test -d dist/assets || exit 1
          echo "Frontend production build verified successfully."

  docker:
    name: Docker Configuration & Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Gateway Image
        run: docker build -t saferoute-gateway:ci .

  security:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Python Dependency Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .
          pip-audit --desc on || echo "pip-audit completed. Inspect report for transitive advisories."
